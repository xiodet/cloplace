# Daily automatic collection of items and news. Commits src/data/generated/*.json
# when anything changed; the hosting platform then redeploys the site.
name: ingest
on:
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run ingest -- --images
      - name: Commit data
        run: |
          git config user.name "drop-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated
          git diff --cached --quiet || git commit -m "data: daily ingest"
          git pull --rebase origin main && git push

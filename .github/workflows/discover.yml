# Manual helper: look up brand stores by Instagram handle (see scripts/discover.mjs).
name: discover
on:
  workflow_dispatch:
    inputs:
      handles:
        description: Space-separated Instagram handles
        required: false
      domains:
        description: Space-separated store domains to check directly
        required: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/discover.mjs
        timeout-minutes: 40
        env:
          HANDLES: ${{ inputs.handles }}
          DOMAINS: ${{ inputs.domains }}
